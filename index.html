in<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PromptShelf – Preview</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14161a;--mute:#6b7280;--line:rgba(0,0,0,.12);--chip:rgba(0,0,0,.06);--acc:#3b4ce8;--modal:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1014;--card:#171a21;--ink:#eceef2;--mute:#9aa1ad;--line:rgba(255,255,255,.18);--chip:rgba(255,255,255,.1);--modal:#171a21;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1014;--card:#171a21;--ink:#eceef2;--mute:#9aa1ad;--line:rgba(255,255,255,.18);--chip:rgba(255,255,255,.1);--modal:#171a21;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px 80px}
.note{background:var(--chip);border-radius:12px;padding:8px 14px;font-size:13px;margin:12px 0;color:var(--mute)}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:12px 0 8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
h1{margin:0;font-size:24px;letter-spacing:-.02em}
.sp{flex:1}
input,textarea,select{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;width:100%}
#q{max-width:380px;border-radius:999px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
.cats button{flex:none;border:0;border-radius:999px;padding:6px 16px;background:var(--chip);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.cats button.on{background:var(--ink);color:var(--bg)}
button.b{border:0;border-radius:999px;background:var(--acc);color:#fff;padding:8px 16px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
button.g,a.g{border:1px solid var(--line);border-radius:999px;background:none;color:var(--ink);padding:8px 16px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.grid{columns:2;column-gap:16px;margin-top:12px}
@media(min-width:760px){.grid{columns:3}}@media(min-width:1040px){.grid{columns:4}}
.card{break-inside:avoid;margin-bottom:16px;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.08);transition:box-shadow .25s}
.card:hover{box-shadow:0 10px 28px rgba(0,0,0,.18)}
.ph{width:100%;cursor:pointer;transition:transform .3s}.card:hover .ph{transform:scale(1.02)}
.imgbox{overflow:hidden}
.meta{padding:12px}
.meta h2{margin:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{margin:4px 0 10px;font-size:12px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .row{gap:6px;flex-wrap:nowrap}.meta button{padding:6px 12px;font-size:12px}
.empty{text-align:center;color:var(--mute);padding:80px 0}
.more{text-align:center;margin-top:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:20;overflow-y:auto;padding:16px;display:none}
.modal.on{display:block}
.mbox{max-width:880px;margin:24px auto;background:var(--modal);border-radius:24px;overflow:hidden}
@media(min-width:760px){.mbox{display:grid;grid-template-columns:1fr 1fr}}
.mbox .info{padding:24px;display:grid;gap:14px;align-content:start}
.mbox h2{margin:0}.mute{color:var(--mute);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:8px}.tags span{background:var(--chip);border-radius:999px;padding:3px 12px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.panel{background:var(--card);border-radius:20px;padding:20px;display:grid;gap:12px;max-width:640px;margin:16px auto}
.panel img{max-height:220px;border-radius:14px;justify-self:start}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px;max-width:640px;margin:8px auto}
.item .t{width:48px;height:48px;border-radius:10px;flex:none}.item div.n{flex:1;min-width:0}.item b{display:block;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="note">This is a visual preview with sample images. On the real site, the pictures come from your own uploads. <a href="#" id="tg" style="color:var(--acc)">Switch to admin view</a></div>

<section id="pub">
<header>
<div class="row"><h1>PromptShelf</h1><div class="sp"></div><input id="q" placeholder="Search titles and prompts" aria-label="Search"></div>
<nav class="cats" id="cats" aria-label="Categories"></nav>
</header>
<div class="grid" id="grid"></div>
<p class="empty" id="empty" hidden>No images match your search. Try a different word or category.</p>
<div class="more"><button class="b" id="more">Load more</button></div>
</section>

<section id="adm" hidden>
<div class="row" style="padding:16px 0"><h1>Admin</h1><div class="sp"></div><a class="g" href="#" id="back">View site</a></div>
<div class="panel">
<b>Upload new image</b>
<input type="file" id="f" accept="image/jpeg,image/png,image/webp">
<img id="pv" alt="Preview" hidden>
<input placeholder="Title"><textarea rows="4" placeholder="Full AI prompt"></textarea>
<select><option>Portraits</option><option>Landscapes</option><option>Fantasy</option><option>Sci-Fi</option></select>
<input placeholder="Tags, separated by commas">
<label class="mute"><input type="checkbox" checked style="width:auto"> Publish immediately</label>
<div><button class="b" id="pubbtn">Publish</button></div>
</div>
<div id="list"></div>
</section>
</div>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
var D=[
{t:"Neon Rain Alley",c:"Sci-Fi",r:1.3,g:["#0f2027","#2c5364","#ff4d8d"],tags:["neon","city"],p:"A narrow cyberpunk alley at night, neon signs reflecting on wet pavement, light rain, cinematic lighting, ultra detailed, 35mm lens"},
{t:"Golden Hour Portrait",c:"Portraits",r:1.5,g:["#f6d365","#fda085","#7b4b3a"],tags:["portrait","warm"],p:"Close-up portrait of a woman in golden hour sunlight, soft rim light, shallow depth of field, freckles, film grain"},
{t:"Crystal Forest",c:"Fantasy",r:.9,g:["#1d976c","#93f9b9","#2b1055"],tags:["forest","magic"],p:"An enchanted forest of glowing crystal trees, floating spores of light, misty atmosphere, fantasy concept art"},
{t:"Desert Monolith",c:"Landscapes",r:.75,g:["#e1b382","#c45c2b","#2d3142"],tags:["desert","minimal"],p:"A lone black monolith in a vast desert at dusk, long shadows, minimalist composition, wide angle"},
{t:"Paper City",c:"Architecture",r:1.1,g:["#e0eafc","#cfdef3","#5b6c8f"],tags:["city","paper"],p:"A miniature city made of folded paper, soft studio light, tilt-shift look, pastel palette"},
{t:"Ink Dragon",c:"Anime",r:1.4,g:["#232526","#414345","#e63946"],tags:["dragon","ink"],p:"A coiling dragon in sumi-e ink style with red accents, dramatic brush strokes, white background"},
{t:"Liquid Chrome",c:"Abstract",r:1,g:["#8e9eab","#eef2f3","#4a4e69"],tags:["abstract","3d"],p:"Flowing liquid chrome shapes, iridescent reflections, studio lighting, 3D render, 8k"},
{t:"Orbit Station",c:"Sci-Fi",r:.8,g:["#000428","#004e92","#f9d423"],tags:["space","station"],p:"A rotating space station above a blue planet at sunrise, hard sci-fi, volumetric light"}
];
var C=["All","Portraits","Landscapes","Fantasy","Sci-Fi","Anime","Architecture","Abstract"],cat="All",q="",n=6,$=function(i){return document.getElementById(i)};
function bg(g){return "linear-gradient(155deg,"+g[0]+","+g[1]+" 55%,"+g[2]+")"}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove("on")},2000)}
function copy(i){var p=D[i].p;(navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(function(){toast("Prompt copied")},function(){toast("Copy is blocked here. Try on the real site.")})}
function show(i){var d=D[i];$("mbox").innerHTML='<div class="ph" style="aspect-ratio:1/'+d.r+';background:'+bg(d.g)+'"></div><div class="info"><h2>'+d.t+'</h2><p style="margin:0;line-height:1.6">'+d.p+'</p><div class="mute">'+d.c+', 1024×'+Math.round(1024*d.r)+'px</div><div class="tags">'+d.tags.map(function(t){return"<span>#"+t+"</span>"}).join("")+'</div><div class="row"><button class="b" onclick="copy('+i+')">Copy prompt</button><button class="g" onclick="hide()">Close</button></div></div>';$("modal").classList.add("on")}
function hide(){$("modal").classList.remove("on")}
$("modal").onclick=function(e){if(e.target===this)hide()};
function render(){
 var f=D.map(function(d,i){return[d,i]}).filter(function(x){var d=x[0];return(cat==="All"||d.c===cat)&&(!q||(d.t+" "+d.p).toLowerCase().indexOf(q)>-1)});
 $("grid").innerHTML=f.slice(0,n).map(function(x){var d=x[0],i=x[1];return'<article class="card"><div class="imgbox" onclick="show('+i+')"><div class="ph" style="aspect-ratio:1/'+d.r+';background:'+bg(d.g)+'"></div></div><div class="meta"><h2>'+d.t+'</h2><p>'+d.p+'</p><div class="row"><button class="b" onclick="copy('+i+')">Copy prompt</button><button class="g" onclick="show('+i+')">View details</button></div></div></article>'}).join("");
 $("empty").hidden=f.length>0;$("more").hidden=f.length<=n;
}
$("cats").innerHTML=C.map(function(c){return'<button data-c="'+c+'"'+(c==="All"?' class="on"':'')+'>'+c+'</button>'}).join("");
$("cats").onclick=function(e){var c=e.target.getAttribute("data-c");if(!c)return;cat=c;n=6;[].forEach.call(this.children,function(b){b.className=b.getAttribute("data-c")===c?"on":""});render()};
$("q").oninput=function(){q=this.value.trim().toLowerCase();n=6;render()};
$("more").onclick=function(){n+=6;render()};
$("f").onchange=function(){var f=this.files[0];if(!f)return;if(["image/jpeg","image/png","image/webp"].indexOf(f.type)<0){toast("Use a JPG, PNG or WEBP image");return}if(f.size>5*1024*1024){toast("Image is larger than 5 MB");return}$("pv").src=URL.createObjectURL(f);$("pv").hidden=false};
$("pubbtn").onclick=function(){toast("Preview only. The real site saves this.")};
$("list").innerHTML=D.slice(0,3).map(function(d,i){return'<div class="item"><div class="t" style="background:'+bg(d.g)+'"></div><div class="n"><b>'+d.t+'</b><span class="mute">'+(i==2?"Draft":"Published")+'</span></div><button class="g">'+(i==2?"Publish":"Unpublish")+'</button><button class="g" style="color:#dc2626">Delete</button></div>'}).join("");
function route(){var a=location.hash==="#admin";$("pub").hidden=a;$("adm").hidden=!a;$("tg").style.display=a?"none":""}
$("tg").onclick=function(e){e.preventDefault();location.hash="admin"};$("back").onclick=function(e){e.preventDefault();location.hash="home"};
window.onhashchange=route;route();render();
</script>
</body>
</html>
